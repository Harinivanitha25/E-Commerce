<!DOCTYPE html>
<html lang="en">
<head>
    <title>Wishlist</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<header class="top-header">
    <h2> My Wishlist</h2>
    <button class="wishlist-btn" onclick="goHome()"> Back</button>
</header>

<section class="products-main">
    <div id="wishlist"></div>
</section>

<script>
const wishlist = JSON.parse(localStorage.getItem("wishlist")) || [];
const container = document.getElementById("wishlist");
if(wishlist.length === 0)
{    container.innerHTML = `
    <div class="empty-cart">
        <img style="Width:570px;"
        src="images/emptywishlist.png"
        alt="Empty Wishlist">

        <h2>Your Wishlist is Empty</h2>
        <p>
            Save your favorite products here and shop later.
        </p>
        <button onclick="goHome()" class="continue-btn">
            Explore Products
        </button>
    </div>
    `;
}

else 
{
    wishlist.forEach(product => {
        const stars = getStars(product.rating);
        container.innerHTML += `
            <div class="product">
                <img src="${product.image}">
                <h3 style="margin-top:20px;">${product.name}</h3>
                <div class="price-row" style="margin-top:12px;">
                    <h2 style="font-size:30px;">₹${product.price}</h2>
                    <span class="old-price">
                        ₹${product.oldPrice}
                    </span>
                </div>
                <span class="discount" >
                     ${product.discount}% OFF
                </span>
                <div class="rating-row" style="margin-top:5px;">
                    <div class="stars">${stars}</div>
                        <span style="font-size:14px;">${product.rating}</span>
                        <span style="font-size:14px;">(${product.reviews} Reviews)</span>
                </div>
                <button class="move-btn" onclick="moveToCart(${product.id})">
                    Move to Cart
                </button>
                <button class="remove-btn" onclick="removeFromWishlist(${product.id})">
                    Remove from Wishlist
                </button>
            </div>
        `;
    });
}

function getStars(rating){
    const fullStars = Math.floor(rating);
    const hasHalfStar = rating % 1 !== 0;
    let stars = "";
    for(let i = 0; i < fullStars; i++){
        stars += `<i class="fa-solid fa-star"></i>`;
    }
    if(hasHalfStar){
        stars += `<i class="fa-solid fa-star-half-stroke"></i>`;
    }
    return stars;
}

function removeFromWishlist(id){
    let wishlist = JSON.parse(localStorage.getItem("wishlist")) || [];
    wishlist = wishlist.filter(item => item.id !== id);
    localStorage.setItem("wishlist", JSON.stringify(wishlist));
    location.reload();
}

function getCart(){
    return JSON.parse(localStorage.getItem("cart")) || [];
}

function saveCart(cart){
    localStorage.setItem("cart", JSON.stringify(cart));
}
function moveToCart(id){
    let wishlist = JSON.parse(localStorage.getItem("wishlist")) || [];
    let cart = getCart();
    const product = wishlist.find(item => item.id === id);
    const existing = cart.find(item => item.id === id);
    if(existing)
    {
        existing.quantity += 1;
    } 
    else 
    {
        cart.push({...product, quantity: 1});
    }
    wishlist = wishlist.filter(item => item.id !== id);
    localStorage.setItem("wishlist", JSON.stringify(wishlist));
    saveCart(cart);
    location.reload();
}

function goHome(){
    window.location.href = "index.html";
}

</script>
</body>
</html>
