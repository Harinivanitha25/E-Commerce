<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Your Cart</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>

<body>

<header class="top-header">
    <h2> Your Cart</h2>
    <button class="cart-btn" onclick="goHome()">Back</button>
</header>

<section class="products-main">
    <div id="cart-container"></div>
</section>

<div id="cart-summary">

    <h2 class="total-text">
        Total: ₹<span id="total">0</span>
    </h2>

    <div class="checkout-wrapper">
        <button class="checkout-btn" onclick="checkout()">
            Checkout
        </button>
    </div>

</div>
<div id="toast"></div>

<script>

function goHome(){
    window.location.href = "Main.html";
}

let cart = JSON.parse(localStorage.getItem("cart")) || [];

function displayCart(){
    const summary = document.getElementById("cart-summary");
    const container = document.getElementById("cart-container");
    const totalEl = document.getElementById("total");
    container.innerHTML = "";
    let sum = 0;
    if(cart.length === 0){

    summary.style.display = "none";

    container.innerHTML = `

    <div class="empty-cart">

        <img 
        src="images/cartempty.png"
        alt="Empty Cart">

        <h2>Your Cart is Empty</h2>

        <p>
            Looks like you haven't added anything yet.
        </p>

        <button onclick="goHome()" class="continue-btn">
            Continue Shopping
        </button>

    </div>

    `;

    totalEl.innerText = 0;

    return;
}

summary.style.display = "block";

    cart.forEach((item,index)=>{
        const stars = getStars(item.rating);
        container.innerHTML += `
        <div class="product">
            <img src="${item.image}">
            <h3 style="margin-top:20px;">${item.name}</h3>
            <h2 style="margin-top:10px;margin-bottom:10px;">₹${item.price}</h2>
            <p class="stars">${stars}</p>
            <div class="quantity">
                <button onclick="decreaseQty(${index})">-</button>
                <span>${item.quantity}</span>
                <button onclick="increaseQty(${index})">+</button>
            </div>

            <button class="remove-btn" onclick="removeItem(${index})">
                Remove
            </button>
        </div>
        `;

        sum += item.price * item.quantity;
    });

    totalEl.innerText = sum;
 
}
function getStars(rating){

    const fullStars = Math.floor(rating);

    const hasHalfStar = rating % 1 !== 0;

    let stars = "";

    for(let i = 0; i < fullStars; i++){
        stars += `<i class="fa-solid fa-star"></i>`;
    }

    if(hasHalfStar){
        stars += `<i class="fa-solid fa-star-half-stroke"></i>`;
    }

    return stars;
}

function increaseQty(i){

    cart[i].quantity++;

    saveCart();
}

function decreaseQty(i){

    if(cart[i].quantity > 1){

        cart[i].quantity--;

    } else {

        cart.splice(i,1);
    }

    saveCart();
}

function removeItem(i){

    cart.splice(i,1);

    saveCart();
}

function saveCart(){

    localStorage.setItem(
        "cart",
        JSON.stringify(cart)
    );

    displayCart();
}

function checkout(){

    cart = [];

    localStorage.setItem(
        "cart",
        JSON.stringify(cart)
    );

    window.location.href = "success.html";
}

function showToast(msg){
    const t = document.getElementById("toast");
    t.innerText = msg;
    t.className = "show";
    setTimeout(()=>t.className="",2000);
}

displayCart();

</script>
</body>
</html>
