    <h2>Product Details</h2>
    <button class="product-btn" onclick="goBack()">Back</button>
</header>

<div class="product-details" id="details"></div>

<div id="toast"></div>

<script>

},
{

    description: "A powerful iPhone with advanced camera system and smooth performance.",

        "6.1-inch Super Retina XDR Display",

    ]
},
{

    rating: 4.5,

    details: [
        "Active Noise Cancellation",
        "Bluetooth 5.2 Connectivity",
        "30 Hours Battery Life",
        "Deep Bass & Clear Audio",
        "Comfortable Over-ear Design"
    ]
},
{
    id: 4,
    name: "Smart Watch",
    price: 5000,
    image: "images/watch.webp",
    rating: 4.3,
    description: "Stay connected and track your fitness with this stylish smartwatch.",
    details: [
        "1.8-inch HD Display",
        "Heart Rate & SpO2 Monitoring",
        "Multiple Sports Modes",
        "Bluetooth Calling",
        "Long Battery Backup"
    ]
},
{
    id: 5,
    name: "Bluetooth Speaker",
    price: 3000,
    image: "images/speaker.jpg",
    rating: 4.2,
    description: "Portable speaker with powerful sound and deep bass.",
    details: [
        "10W Output Sound",
        "Bluetooth 5.0",
        "Up to 10 Hours Playtime",
        "Water-resistant Design",
        "Compact & Portable"
    ]
},
{
    id: 6,
    name: "Gaming Mouse",
    price: 1500,
    image: "images/mouse.jpg",
    rating: 4.4,
    description: "Precision gaming mouse with customizable buttons and RGB lighting.",
    details: [
        "Adjustable DPI up to 7200",
        "Ergonomic Design",
        "RGB Lighting Effects",
        "6 Programmable Buttons",
        "High-speed Tracking"
    ]
},
{
    id: 7,
    name: "Mechanical Keyboard",
    price: 4000,
    image: "images/keyboard.jpg",
    rating: 4.6,
    description: "Mechanical keyboard with tactile feedback and durable build.",
    details: [
        "Blue Switches for Clicky Feel",
        "RGB Backlighting",
        "Full-size Keyboard",
        "Anti-Ghosting Keys",
        "USB Wired Connection"
    ]
},
{
    id: 8,
    name: "Tablet",
    price: 25000,
    image: "images/tablet.jpg",
    rating: 4.3,
    description: "Lightweight tablet perfect for entertainment and productivity.",
    details: [
        "10.5-inch Full HD Display",
        "6GB RAM, 128GB Storage",
        "Octa-core Processor",
        "8000mAh Battery",
        "Slim & Portable Design"
    ]
}
];

const params = new URLSearchParams(window.location.search);
const id = parseInt(params.get("id"));

const product = products.find(p => p.id === id);
const details = document.getElementById("details");

details.innerHTML = `
<div class="details-card">
    <img src="${product.image}" class="details-img">
    
    <div class="details-info">
        <h1>${product.name}</h1>
        <p class="price">₹${product.price}</p>
        <p>${product.description}</p>
        <p>${"⭐".repeat(Math.floor(product.rating))}</p>

        <ul>
            ${product.details.map(d => `<li>${d}</li>`).join("")}
        </ul>

        <button class="add-btn" onclick="addToCart(${product.id})">
            Add to Cart
        </button>
    </div>
</div>
`;


function goBack(){
    window.location.href = "Main.html";
}

function addToCart(id){
    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    const product = products.find(p => p.id === id);
    const existing = cart.find(item => item.id === id);

    if(existing){
        existing.quantity += 1;
    } else {
        cart.push({...product, quantity: 1});
    }

    localStorage.setItem("cart", JSON.stringify(cart));

    showToast("Added to cart");
}

function showToast(msg){
    const t = document.getElementById("toast");
    t.innerText = msg;
    t.className = "show";
    setTimeout(()=>t.className="",2000);
}

</script>

</body>
