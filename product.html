<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Details</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
<header class="top-header">
    <h2>Product Details</h2>
    <div class="header-buttons details-header-buttons">

        <button onclick="goToWishlist()" class="wishlist-btn"> My Wishlist (<span id="wish-count">0</span>)
        </button>
        <button class="cart-btn" onclick="goToCart()"> Cart (<span id="cart-count">0</span>)
        </button>

    </div>

    <button class="product-btn" onclick="goBack()">
        Back
    </button>

</header>

<div id="details"></div>
<div id="toast"></div>

<script src="products.js"></script>
<script>

const params = new URLSearchParams(window.location.search);
const id = parseInt(params.get("id"));
const product = products.find(p => p.id === id);
const details = document.getElementById("details");
const loggedEmail = localStorage.getItem("loggedUserEmail") || "guest";
const CART_KEY = `cart_${loggedEmail}`;
const WISHLIST_KEY = `wishlist_${loggedEmail}`;
function displayProduct(){
    if(!product){
        details.innerHTML = `
            <h2 style="text-align:center;">
                Product not found
            </h2>
        `;
        return;
    }
    const stars = getStars(product.rating);
    details.innerHTML = `
    <div class="details-container">

        <div class="details-left">
            <img src="${product.image}" loading="lazy" class="details-image">
            <div class="tags">
                ${product.tags.map(tag => `
                    <span class="tag">${tag}</span>
                `).join("")}

            </div>
        </div>

        <div class="details-right">
            <p class="brand">${product.brand}</p>
            <h1>${product.name}</h1>
            <div class="rating-row" >
                <div class="stars">${stars}</div>
                <span>${product.rating}</span>
                <span>
                    (${product.reviews} Reviews)
                </span>
            </div>
            <div class="price-row" style="margin-top:12px;">
                <h2>₹${product.price}</h2>
                <span class="old-price">
                    ₹${product.oldPrice}
                </span>
                <span class="discount">
                    ${product.discount}% OFF
                </span>
            </div>
            <p class="description">
                ${product.description}
            </p>
            <p class="stock">
                ${product.availability}
            </p>

            <div class="box">
                <h3>Key Features</h3>
                <ul>
                    ${product.features.map(feature => `
                        <li>${feature}</li>
                    `).join("")}
                </ul>
            </div>

            <div class="box">
                <h3>Specifications</h3>
                <table>
                    ${Object.entries(product.specifications).map(([key,val]) => `
                        <tr>
                            <td>${key}</td>
                            <td>${val}</td>
                        </tr>
                    `).join("")}
                </table>
            </div>

            <div class="buttons">
                <button 
                onclick="addToCart(${product.id})">
                    Add To Cart
                </button>
                <button 
                onclick="toggleWishlist(${product.id})">
                    Add Wishlist
                </button>
            </div>

        </div>

    </div>
    
<div class="extra-section">
    <h2>Delivery Information</h2>
    <div class="review-card">
        <p>
            <strong>Free Delivery :</strong>
            ${product.delivery.freeDelivery ? "Yes" : "No"}
        </p>
        <p>
            <strong>Estimated Delivery :</strong>
            ${product.delivery.estimated}
        </p>
    </div>
</div>


<div class="extra-section">
    <h2>Available Offers</h2>
    ${product.offers.map(offer => `
        <div class="review-card">
            <p> ${offer}</p>
        </div>
    `).join("")}
</div>


<div class="extra-section">
    <h2>Seller Information</h2>
    <div class="review-card">
        <h4>${product.seller.name}</h4>
        <p>
            Seller Rating :
            ⭐ ${product.seller.rating}
        </p>
    </div>
</div>

<div class="extra-section">
        <h2>FAQ</h2>
        ${product.faq.map(item => `
            <div class="faq-item">
                <h4>${item.question}</h4>
                <p>${item.answer}</p>
            </div>
        `).join("")}
</div>

<div class="extra-section">
        <h2>Customer Reviews</h2>
        ${product.reviewsData.map(review => `
            <div class="review-card">
                <h4>${review.user}</h4>
                <div class="stars">
                    ${getStars(review.rating)}
                </div>
                <p>${review.comment}</p>
            </div>
        `).join("")}
</div>
    `;
}


function getStars(rating){
    const fullStars = Math.floor(rating);
    const hasHalf = rating % 1 !== 0;
    let stars = "";
    for(let i=0; i<fullStars; i++){
        stars += `
        <i class="fa-solid fa-star"></i>
        `;
    }
    if(hasHalf){
        stars += `
        <i class="fa-solid fa-star-half-stroke"></i>
        `;
    }
    return stars;
}

function toggleWishlist(id){
    let wishlist =
    JSON.parse(localStorage.getItem(WISHLIST_KEY)) || [];
    const exists =
    wishlist.find(item => item.id === id);
    if(exists)
    {
        showToast("Already in Wishlist");
    } 
    else 
    {
        wishlist.push(product);
        showToast("Added to Wishlist");
    }
    localStorage.setItem(
        WISHLIST_KEY,
        JSON.stringify(wishlist)
    );
    updateWishlistCount();
}

function addToCart(id){
    let cart =
    JSON.parse(localStorage.getItem(CART_KEY)) || [];
    const existing =
    cart.find(item => item.id === id);
    if(existing)
    {
        existing.quantity += 1;
    } 
    else 
    {
        cart.push({
            ...product,
            quantity:1
        });
    }
    localStorage.setItem(
        CART_KEY,
        JSON.stringify(cart)
    );
    updateCart();
    showToast("Added to Cart");
   
}

function showToast(msg){
    const t = document.getElementById("toast");
    t.innerText = msg;
    t.className = "show";
    setTimeout(()=>{
        t.className = "";
    },2000);
}

function getWishlist(){
    return JSON.parse(localStorage.getItem(WISHLIST_KEY)) || [];
}

function saveWishlist(w){
    localStorage.setItem(WISHLIST_KEY,JSON.stringify(w));
}

function updateCart(){
    let latestCart=JSON.parse(localStorage.getItem(CART_KEY)) || [];
    const count=latestCart.reduce((total,item)=> total + item.quantity,0);
    document.getElementById("cart-count").innerText = count;
}
window.addEventListener("storage", updateCart);

function updateWishlistCount(){
    document.getElementById("wish-count")
    .innerText = getWishlist().length;
}

function goToWishlist(){
    window.location.href="wishlist.html";
}

function goToCart(){
    window.location.href="cart.html";
}

function goBack(){
    window.location.href = "index.html";
}

displayProduct();
updateCart();
updateWishlistCount();

</script>
</body>
</html>
